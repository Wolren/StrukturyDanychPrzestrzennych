[project]
name = "struktury-danych"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "pillow>=12.3.0",
]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "missing-class-docstring",
    "missing-function-docstring",
]

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.1.1",
]
